name: Continuous Integration

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main"]

jobs:
  validacao-estatica:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Verificar arquivos essenciais
        run: |
          test -f index.html && echo "HTML encontrado!"
          test -f style.css && echo "CSS encontrado!"

      - name: Preparar arquivos de distribuição
        run: |
          mkdir -p dist
          if [ -f style.css ]; then
            cp style.css dist/
          else
            echo "Aviso: style.css não encontrado, ignorado"
          fi