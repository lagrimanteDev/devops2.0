name: Continuous Integration

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main"]

jobs:
  validacao-estatica:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Verificar arquivos essenciais
        run: |
          test -f index.html && echo "HTML encontrado!"
          test -f style.css && echo "CSS encontrado!"

      - name: Preparar arquivos de distribuição
        run: |
          rm -rf dist
          mkdir dist
          cp *.html dist/
          cp -r assets dist/
          ls -R dist/

      - name: Auditoria de Qualidade
        run: |
          test -f dist/index.html
          test -f dist/sobre.html
          test -f dist/contato.html